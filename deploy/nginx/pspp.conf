# PSPP v2.0 — nginx para despliegue nativo (sin Docker)
#
# Adaptado de nginx/default.conf (el que usa docker-compose.prod.yml).
# Dos diferencias de fondo con esa version, por correr sin Docker:
#   - El backend ya no se alcanza por el nombre de servicio "backend"
#     dentro de una red de Docker, sino por 127.0.0.1:3100 (el puerto
#     que PORT= define en pspp.env; ver pspp-backend.service).
#   - nginx mismo sirve los archivos estaticos de frontend/dist (root),
#     en vez de leerlos de un volumen compartido con otro contenedor.
# Validado con "nginx -t" antes de recargar.

server {
    listen 8090;
    server_name _;

    root /opt/pspp/frontend/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Notificaciones en tiempo real (Server-Sent Events). Esta location
    # necesita proxy_buffering off: sin eso, nginx junta los avisos del
    # backend en su propio buffer hasta llenarlo o hasta que la conexion
    # se cierre, y "tiempo real" deja de serlo -- llegan todos de golpe
    # al final, o nunca si la conexion sigue abierta. El sintoma no es un
    # error, es que la campana de notificaciones simplemente no actualiza
    # sola: por eso es facil omitir esto por accidente y que nadie lo
    # note hasta que alguien pregunte por que no le llegan avisos.
    # proxy_read_timeout 24h mantiene la conexion abierta el tiempo que
    # haga falta; sin eso, nginx la cierra por inactividad y el navegador
    # tiene que reconectar.
    location /api/v1/notificaciones/stream {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # API del backend. client_max_body_size tiene que ser UN POCO MAYOR que
    # UPLOAD_MAX_SIZE_MB de pspp.env (ver deploy/pspp.env.example): nginx
    # mide el cuerpo completo (archivo + separadores multipart + campos del
    # formulario) y el backend solo el archivo. Con los dos en 200, un
    # archivo de casi 200 MB pasaba el backend pero nginx lo rechazaba
    # antes con un 413 que no menciona UPLOAD_MAX_SIZE_MB. 210M = 200 + un
    # margen holgado. Tabla completa de la cadena: deploy/README.md, 12.
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 210M;
        # Lectura del cuerpo: se corta si pasan 60 s sin recibir nada (es el
        # valor por omision de nginx; se deja explicito porque el frontend
        # cancela con el mismo criterio, VITE_TRANSFERENCIA_SIN_AVANCE_MS).
        client_body_timeout 60s;
        # Sin copias de archivos en el disco de nginx: el servidor no tiene
        # espacio para almacenar nada (mismo motivo por el que el backend
        # borra siempre sus temporales de subida).
        #   proxy_request_buffering off: la subida pasa directo al backend
        #     conforme llega, en vez de escribirse primero completa en
        #     client_body_temp.
        #   proxy_max_temp_file_size 0: una descarga más grande que los
        #     buffers en memoria no se vuelca a proxy_temp; nginx la
        #     entrega al ritmo del navegador.
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Esta location tiene su propio add_header (expires), asi que en
    # nginx deja de heredar los add_header del server (X-Frame-Options,
    # X-Content-Type-Options, Referrer-Policy): nginx no acumula
    # add_header de distintos niveles, el bloque mas especifico que
    # declare uno solo gana los suyos. Por eso aqui NO se agrega
    # Cache-Control con add_header -- si se agregara, las tres cabeceras
    # de seguridad del server dejarian de aplicar a todo lo que cae en
    # este bloque (js, css, imagenes, fuentes), que es casi todo el
    # trafico estatico del sitio.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
    }
}
