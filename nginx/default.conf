# ARCHIVO: default.conf
# PROPÓSITO: Configuración de Nginx como reverse proxy para producción.
#
# NOTA TÉCNICA: Nginx como reverse proxy
# ─────────────────────────────────────────────────────────────────
# En producción, Nginx recibe TODAS las peticiones HTTP y decide
# a dónde enviarlas: /api/* → backend (Node.js en puerto 3000),
# todo lo demás → archivos estáticos del frontend (React build).
# Esto desacopla el frontend del backend y permite servir los
# archivos estáticos con máxima eficiencia (gzip, cache headers).
# ─────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    # Cabeceras de seguridad (paso 9 DGTIC). A nivel server para que las
    # herede toda location que no declare las suyas — nginx NO acumula
    # add_header de distintos niveles: el bloque más específico que
    # declare uno solo gana los suyos. La location de archivos estáticos
    # de abajo SÍ declara su propio add_header (Cache-Control), así que
    # repite estas cuatro explícitamente ahí; si alguna vez se agrega un
    # add_header nuevo aquí, hay que replicarlo también ahí o dejará de
    # aplicar a js/css/imágenes/fuentes, que es casi todo el tráfico
    # estático del sitio.
    #
    # Detalle de cada directiva de CSP y por qué, en deploy/README.md:
    #   - style-src necesita 'unsafe-inline' por Leaflet, NO por los
    #     `style={{...}}` de React (probado con el navegador real: sin
    #     unsafe-inline, Login —toda en estilos inline de React— no
    #     reporta ninguna violación; el mapa sí, al posicionar sus
    #     teselas). Detalle completo en deploy/README.md.
    #   - img-src permite basemaps.cartocdn.com (mapa base de Leaflet,
    #     frontend/src/utils/cartoBasemap.js) y tile.openstreetmap.org
    #     (vista previa de capas geográficas, FilePreviewModal.jsx).
    #   - frame-src permite blob: (vista previa de PDF) y https: (abrir
    #     una evidencia de tipo "enlace", que apunta a un sitio externo
    #     arbitrario que no se puede listar de antemano).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;

    # Frontend — archivos estáticos de React build
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Notificaciones en tiempo real (Server-Sent Events) — location propia,
    # más específica que /api/ (Nginx elige el prefijo más largo, sin
    # importar el orden en el archivo), porque necesita el buffering
    # apagado: con el buffering normal de /api/, Nginx juntaría los avisos
    # en su buffer hasta llenarlo o hasta que la conexión se cerrara, y
    # "tiempo real" dejaría de serlo — llegarían todos de golpe al final.
    location /api/v1/notificaciones/stream {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # Backend API — proxy al servicio Node.js
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout para subida de archivos grandes (shapefiles)
        client_max_body_size 200M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check
    location /health {
        proxy_pass http://backend:3000/health;
    }

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Cache de archivos estáticos — repite las cuatro cabeceras de
    # seguridad del server de arriba: esta location ya declaraba su
    # propio add_header (Cache-Control), así que sin esto perdería las
    # del server para TODO el tráfico estático (ver el comentario de
    # arriba).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.basemaps.cartocdn.com https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self'; frame-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';" always;
    }
}
